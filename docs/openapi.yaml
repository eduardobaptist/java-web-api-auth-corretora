openapi: 3.0.3
info:
  title: API Corretora de Imóveis (javaweb2)
  version: 0.0.1
  description: |
    API REST de uma corretora de imóveis em Spring Boot 4 (Java 21) com MySQL.

    ## Autenticação
    - `POST /auth/login` com `{ email, senha }` devolve `{ token }` (JWT HS256, validade padrão de 120 min).
    - Envie o token em todas as rotas protegidas: `Authorization: Bearer <token>`.
    - Claims do token: `sub` (e-mail), `id`, `nome`, `roles` (ex.: `["ADMIN"]`), `iss` = `javaweb2`, `iat`, `exp`.
      O frontend pode decodificar o payload (base64url) para ler `nome`/`roles` sem chamar `/auth/me`.
    - Não existe refresh token: quando expirar (401), é preciso logar de novo.
    - Autocadastro de clientes: `POST /auth/cadastro` com `{ nome, email, senha }` cria um usuário **BASIC**
      e já devolve `{ token }` (mesmo formato do login), então o cliente sai logado.

    ## Regras de acesso
    | Rota | Acesso |
    |------|--------|
    | `POST /auth/login`, `POST /auth/cadastro` | público |
    | `GET /imoveis`, `GET /imoveis/{id}` | público |
    | `GET /uploads/**` (arquivos das fotos) | público |
    | `POST /imoveis/sabermais/{id}` | público |
    | `POST/PUT/DELETE /imoveis/**` | ADMIN |
    | `/fotos/**` | ADMIN |
    | `/user/**` (inclui `GET /user/{id}/favoritos`) | ADMIN |
    | `GET /ofertas`, `PATCH /ofertas/{id}/status` | ADMIN |
    | `GET /contratos`, `POST /contratos`, `POST /contratos/previa`, `POST /contratos/{id}/cancelar` | ADMIN |
    | `POST /ofertas`, `GET /ofertas/minhas`, `GET /ofertas/{id}`, `POST /ofertas/{id}/cancelar` | autenticado (dono da oferta; o admin vê todas) |
    | `GET /contratos/meus`, `GET /contratos/{id}`, `GET /contratos/{id}/pdf`, `POST /contratos/{id}/assinar` | autenticado (cliente da oferta; o admin vê todos, mas só o cliente assina) |
    | `/favoritos/**` | autenticado (sempre os favoritos do próprio usuário) |
    | demais rotas (`/auth/me`, `/bairros/**`, `/tipos-imoveis/**`, `/email`) | qualquer usuário autenticado |

    Sem token ou token inválido → `401` (corpo vazio, header `WWW-Authenticate: Bearer ...`).
    Token válido sem a role necessária → `403` (corpo vazio).
    Oferta/contrato de outro usuário (para quem não é admin) → `404`, como se não existisse.

    Nas rotas públicas (`POST /auth/login`, `POST /auth/cadastro`, `GET /imoveis`, `GET /imoveis/{id}`, `POST /imoveis/sabermais/{id}`,
    `GET /uploads/**`) o header `Authorization`
    é ignorado. O frontend pode enviar o token em todas as requisições: um token expirado não quebra as
    rotas públicas. Nas demais rotas, um `401` significa token ausente/expirado → redirecionar para o login.

    ## Paginação
    Todos os endpoints de listagem (`GET /imoveis`, `GET /bairros`, `GET /tipos-imoveis`, `GET /user/`, `GET /ofertas`,
    `GET /ofertas/minhas`, `GET /contratos`, `GET /contratos/meus`, `GET /favoritos`, `GET /user/{id}/favoritos`) são paginados.
    - Query params: `page` (começa em **0**), `size` (padrão 20, máximo 100; valores maiores são reduzidos para 100)
      e `sort=campo,asc|desc`. O `sort` pode ser repetido para ordenar por vários campos, e o padrão é `id,asc`.
      Campos de relacionamento usam ponto: `sort=bairro.nome,asc`.
    - Resposta:
      ```json
      { "content": [ ... ], "page": { "size": 20, "number": 0, "totalElements": 57, "totalPages": 3 } }
      ```
    - `sort` com campo inexistente → `500`.
    - Para preencher selects (bairros e tipos no formulário de imóvel), use `?size=100`.

    ## Convenções importantes para o frontend
    - Criação (`POST`) de bairro, tipo de imóvel e imóvel responde `201` **sem corpo**; o id do novo
      registro vem apenas no header `Location` (ex.: `http://localhost:8080/imoveis/12`).
    - Atualização (`PUT`) de bairro, tipo de imóvel e imóvel responde `204` sem corpo.
      O `PUT` substitui o registro inteiro: campos omitidos viram `null`.
    - Relacionamentos (`tipoImovel`, `bairro`, `imovel`) são enviados como objeto com apenas o id: `{ "id": 3 }`.
    - Valores monetários/área (`BigDecimal`) são serializados como número JSON.
    - Datas (`createdAt`, `updatedAt`) são `LocalDateTime` sem fuso, no formato ISO (`2026-10-27T14:03:21.123456`).
    - Erros não tratados seguem o formato padrão do Spring Boot (`ErrorResponse`).

    ## Validação e formato dos erros (`400`)
    Todo erro de validação responde `400` com um objeto plano `{ "campo": "mensagem" }`, com **uma mensagem por
    campo** (a primeira regra que falhou). Campos aninhados usam ponto (`tipoImovel.id`). A ordem das chaves não é
    garantida. Exemplo:
    ```json
    { "titulo": "O título é obrigatório.", "cep": "CEP inválido. Use o formato 00000-000." }
    ```
    Casos especiais, todos no mesmo formato:
    - Valor com tipo errado no JSON (ex.: `"abc"` em `precoVenda`, `role` fora do enum): `{ "precoVenda": "Formato inválido." }`.
    - JSON malformado ou corpo ausente: `{ "corpo": "JSON inválido ou ausente." }`.
    - Path variable com tipo errado (ex.: `/imoveis/abc`): `{ "id": "Formato inválido." }`.
    - Parâmetro de formulário/multipart ausente (ex.: `imovelId` em `/fotos`): `{ "imovelId": "Campo obrigatório." }`.
    - Query param com valor fora do enum (ex.: `?status=XYZ`): `{ "status": "Formato inválido." }`.
    - Arquivo acima de 10MB (`spring.servlet.multipart.max-file-size`; vale para fotos e contratos): `{ "arquivo": "O arquivo excede o tamanho máximo de 10MB." }`.

    ## Conflitos de estado (`409`)
    Quando a requisição é válida mas o status atual do registro não permite a operação (ex.: aceitar uma oferta
    cancelada, assinar um contrato já assinado), a resposta é `409` no mesmo formato `{ "campo": "mensagem" }`.

    ## Fluxo de oferta → contrato → assinatura
    O imóvel tem `status` (`StatusImovel`): `DISPONIVEL`, `RESERVADO`, `ALUGADO`, `VENDIDO`. **Só imóveis `DISPONIVEL`
    recebem ofertas** (no frontend, mostre o botão "Fazer oferta" só quando `imovel.status == "DISPONIVEL"`).
    Vários clientes podem ofertar no mesmo imóvel ao mesmo tempo. `PENDENTE` e `EM_ESPERA` são equivalentes
    ("em aberto"): cada cliente pode ter só uma oferta em aberto por imóvel.

    | # | Ação | Quem | Efeito na oferta | Efeito automático no imóvel e nas outras ofertas dele |
    |---|------|------|------------------|--------------------------------------------------------|
    | 1 | `POST /ofertas` | cliente | nasce `PENDENTE` | exige imóvel `DISPONIVEL` (senão `409`) |
    | 2 | `PATCH /ofertas/{id}/status` `ACEITA` | admin | `ACEITA` | exige imóvel `DISPONIVEL` (senão `409`); imóvel → `RESERVADO`; as outras `PENDENTE` → `EM_ESPERA` |
    | 2b | `PATCH /ofertas/{id}/status` `EM_ESPERA`/`RECUSADA` | admin | o status enviado | nenhum |
    | 2c | `POST /ofertas/{id}/cancelar` | cliente (dono) | `CANCELADA` | nenhum |
    | 3 | `POST /contratos` (gerar ou upload) | admin | continua `ACEITA` | nenhum (contrato `AGUARDANDO_ASSINATURA`) |
    | 4 | `POST /contratos/{id}/assinar` | cliente (dono) | continua `ACEITA` | imóvel → `ALUGADO` (oferta de aluguel) ou `VENDIDO` (venda); as outras em aberto → `RECUSADA` |
    | 5 | `POST /contratos/{id}/cancelar` (desistência) | admin | `CANCELADA` | imóvel `RESERVADO` → `DISPONIVEL`; as outras `EM_ESPERA` → `PENDENTE` |

    - `2b`/`2c` só valem para oferta em aberto; `ACEITA`, `RECUSADA` e `CANCELADA` são finais (`409`).
    - Só um contrato ativo (`AGUARDANDO_ASSINATURA`/`ASSINADO`) por oferta, e só oferta `ACEITA` recebe contrato. Como o
      cancelamento do contrato cancela a oferta, para recomeçar o cliente faz uma oferta nova (ou o admin aceita uma
      das que voltaram a `PENDENTE`).
    - Contrato assinado não pode ser cancelado (`409`).
    - O passo 5 só devolve o imóvel a `DISPONIVEL` se ele ainda estiver `RESERVADO`; se o admin trocou o status
      manualmente, ele é mantido.
    - O admin pode mudar `status` do imóvel livremente no `PUT /imoveis/{id}`, sem efeito nas ofertas.
    - Operações simultâneas no mesmo imóvel (ex.: aceitar duas ofertas ao mesmo tempo) são serializadas: a primeira
      vence e a segunda recebe `409`.
    - Depois de qualquer ação, recarregue as listas: as outras ofertas do imóvel podem ter mudado de status.

    Formas de criar o contrato (passo 3): **gerar** (`application/json` com `ContratoGerarInput`, a API monta o PDF
    com os dados da oferta) ou **upload** (`multipart/form-data` com um PDF pronto). Antes de gerar, dá para conferir
    com `POST /contratos/previa`. O cliente vê os contratos em `GET /contratos/meus` e baixa o PDF em `urlPdf` (com token).

    O PDF **não** fica em `/uploads` (que é público): é baixado só por `GET /contratos/{id}/pdf`, com token. Para
    exibir num `<iframe>`/nova aba, baixe com `fetch` + `Authorization` e use `URL.createObjectURL(blob)`.

    As regras de cada campo (obrigatório, `maxLength`, `pattern`, `minimum` etc.) estão nos schemas `*Input`/`*Request`
    e seguem as colunas do banco. Strings vazias ou só com espaços contam como ausentes nos campos obrigatórios.
    A validação roda antes do controle de existência: um `PUT` inválido para um id inexistente responde `400`, não `404`.
    - CORS **não** está configurado no backend; um frontend em outra origem precisa de proxy no dev server
      ou de configuração de CORS no Spring.
    - `GET /imoveis` e `GET /imoveis/{id}` devolvem `fotos`: array com as URLs absolutas das fotos
      (a capa vem primeiro; array vazio se não houver fotos). As URLs apontam para `GET /uploads/{imovelId}/{arquivo}`,
      que é público e pode ser usado direto em `<img src>`.
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local

tags:
  - name: Auth
  - name: Imóveis
  - name: Fotos
  - name: Bairros
  - name: Tipos de imóvel
  - name: Usuários
  - name: Ofertas
  - name: Contratos
  - name: Favoritos
  - name: E-mail

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica e devolve um JWT
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@admin.com
              senha: admin123
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Credenciais inválidas
          content:
            text/plain:
              schema:
                type: string
                example: E-mail ou senha inválidos.

  /auth/cadastro:
    post:
      tags: [Auth]
      summary: Autocadastro de cliente (role BASIC) e devolve um JWT
      description: |
        Rota pública. O usuário é sempre criado com role `BASIC`: um campo `role` enviado no corpo é ignorado.
        Os espaços nas pontas de `nome` e `email` são removidos. A resposta já traz o token, então não é
        preciso chamar `/auth/login` em seguida.
      operationId: cadastro
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroRequest'
            example:
              nome: Maria Silva
              email: maria@exemplo.com
              senha: segredo123
      responses:
        '201':
          description: Cliente cadastrado e autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: E-mail já cadastrado
          content:
            text/plain:
              schema:
                type: string
                example: E-mail já cadastrado.

  /auth/me:
    get:
      tags: [Auth]
      summary: Dados do usuário logado
      operationId: getMe
      responses:
        '200':
          description: Usuário do token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Usuário do token não existe mais

  /imoveis:
    get:
      tags: [Imóveis]
      summary: Lista imóveis paginados (com as URLs das fotos)
      operationId: listImoveis
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de imóveis. Cada item traz `fotos` com as URLs das fotos daquele imóvel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageImovel'
    post:
      tags: [Imóveis]
      summary: Cria um imóvel
      operationId: createImovel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImovelInput'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /imoveis/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Imóveis]
      summary: Busca um imóvel por id (com as URLs das fotos)
      operationId: getImovel
      security: []
      responses:
        '200':
          description: Imóvel encontrado, com `fotos` preenchido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imovel'
        '404':
          description: Imóvel não encontrado (corpo vazio)
    put:
      tags: [Imóveis]
      summary: Atualiza (substitui) um imóvel
      operationId: updateImovel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImovelInput'
      responses:
        '204':
          description: Atualizado
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Imóvel não encontrado
    delete:
      tags: [Imóveis]
      summary: Exclui um imóvel
      operationId: deleteImovel
      responses:
        '204':
          description: Excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /imoveis/sabermais/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Imóveis]
      summary: Envia e-mail de interesse ("saber mais") sobre um imóvel
      description: |
        Formulário de contato público: qualquer visitante pode enviar, sem login.
        Dispara um e-mail HTML para a corretora com os dados do interessado e do imóvel.
      operationId: saberMaisImovel
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImovelSaberMais'
      responses:
        '200':
          description: E-mail enviado (corpo vazio)
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Imóvel não encontrado (corpo vazio; nenhum e-mail é enviado)
        '500':
          description: Falha ao enviar o e-mail
          content:
            text/plain:
              schema:
                type: string
                example: Ocorreu um erro ao enviar o e-mail.

  /uploads/{imovelId}/{arquivo}:
    get:
      tags: [Fotos]
      summary: Arquivo de uma foto
      description: |
        Arquivo estático gravado em `app.upload.dir`. Não é preciso montar essa URL: use as URLs prontas
        do campo `fotos` de `GET /imoveis` e `GET /imoveis/{id}`.
      operationId: getArquivoFoto
      security: []
      parameters:
        - name: imovelId
          in: path
          required: true
          schema:
            type: integer
        - name: arquivo
          in: path
          required: true
          description: '`nomeArquivo` da foto (`<uuid>_<nome original>`), com URL-encoding'
          schema:
            type: string
      responses:
        '200':
          description: Conteúdo da imagem
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Arquivo não encontrado

  /fotos:
    post:
      tags: [Fotos]
      summary: Envia uma foto para um imóvel
      operationId: uploadFoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo, imovelId]
              properties:
                arquivo:
                  type: string
                  format: binary
                  description: |
                    Imagem JPEG, PNG ou WebP (pelo `Content-Type` da parte), não vazia,
                    com nome original de no máximo 150 caracteres.
                imovelId:
                  type: integer
      responses:
        '200':
          description: Foto salva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FotoImovel'
        '400':
          description: |
            Erro de validação no formato `{ campo: mensagem }`. Mensagens possíveis em `arquivo`:
            `O arquivo é obrigatório e não pode estar vazio.`, `Formato inválido. Envie uma imagem JPEG, PNG ou WebP.`,
            `O arquivo precisa ter um nome.`, `O nome do arquivo deve ter no máximo 150 caracteres.`.
            Parâmetro ausente: `{ "imovelId": "Campo obrigatório." }` (ou `fotoId`, `arquivo`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              example:
                arquivo: Formato inválido. Envie uma imagem JPEG, PNG ou WebP.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: 'Erro ao salvar (ex.: imóvel inexistente)'
    put:
      tags: [Fotos]
      summary: Substitui o arquivo de uma foto existente
      operationId: replaceFoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo, fotoId]
              properties:
                arquivo:
                  type: string
                  format: binary
                  description: |
                    Imagem JPEG, PNG ou WebP (pelo `Content-Type` da parte), não vazia,
                    com nome original de no máximo 150 caracteres.
                fotoId:
                  type: integer
      responses:
        '200':
          description: Foto atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FotoImovel'
        '400':
          description: |
            Erro de validação no formato `{ campo: mensagem }`. Mensagens possíveis em `arquivo`:
            `O arquivo é obrigatório e não pode estar vazio.`, `Formato inválido. Envie uma imagem JPEG, PNG ou WebP.`,
            `O arquivo precisa ter um nome.`, `O nome do arquivo deve ter no máximo 150 caracteres.`.
            Parâmetro ausente: `{ "imovelId": "Campo obrigatório." }` (ou `fotoId`, `arquivo`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              example:
                arquivo: Formato inválido. Envie uma imagem JPEG, PNG ou WebP.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: 'Erro ao salvar (ex.: foto inexistente)'

  /fotos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Fotos]
      summary: Define a foto como capa do imóvel
      description: Marca `capa = true` nesta foto e `capa = false` nas demais fotos do mesmo imóvel.
      operationId: setFotoCapa
      responses:
        '200':
          description: Capa definida (corpo vazio)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Fotos]
      summary: Exclui a foto (registro e arquivo)
      operationId: deleteFoto
      responses:
        '200':
          description: Excluída (corpo vazio)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /bairros:
    get:
      tags: [Bairros]
      summary: Lista bairros paginados
      operationId: listBairros
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de bairros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBairro'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Bairros]
      summary: Cria um bairro
      operationId: createBairro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BairroInput'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bairros/bairros-page:
    get:
      tags: [Bairros]
      summary: Alias de `GET /bairros` (obsoleto)
      description: Mantido por compatibilidade; idêntico a `GET /bairros`. Use `GET /bairros`.
      deprecated: true
      operationId: pageBairros
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de bairros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBairro'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bairros/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Bairros]
      summary: Busca um bairro por id
      description: Se o id não existir, responde `200` com corpo vazio (não `404`).
      operationId: getBairro
      responses:
        '200':
          description: Bairro (ou corpo vazio se não existir)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bairro'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Bairros]
