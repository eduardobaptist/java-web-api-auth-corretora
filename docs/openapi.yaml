  /ofertas/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Ofertas]
      summary: Admin aceita, recusa ou coloca a oferta em espera
      description: |
        Só para oferta em aberto (`PENDENTE`/`EM_ESPERA`).

        **`ACEITA`** exige o imóvel `DISPONIVEL` e, na mesma transação:
        - o imóvel passa a `RESERVADO`;
        - todas as outras ofertas `PENDENTE` desse imóvel passam a `EM_ESPERA` (as que já estavam em espera continuam).

        `EM_ESPERA` e `RECUSADA` só mudam a própria oferta (funcionam mesmo com o imóvel reservado).
        Duas aceitações simultâneas no mesmo imóvel: a primeira vence e a segunda recebe `409`.
      operationId: updateOfertaStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaStatusInput'
      responses:
        '200':
          description: Oferta atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Oferta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Oferta não encontrada (corpo vazio)
        '409':
          description: |
            `{ "status": "Só ofertas pendentes ou em espera podem ter o status alterado." }` (oferta já aceita, recusada
            ou cancelada) ou, ao aceitar, `{ "status": "Só é possível aceitar ofertas de imóveis disponíveis (o imóvel está RESERVADO)." }`
            (o status atual do imóvel vem na mensagem: `RESERVADO`, `ALUGADO` ou `VENDIDO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              examples:
                fechada:
                  value:
                    status: Só ofertas pendentes ou em espera podem ter o status alterado.
                imovelIndisponivel:
                  value:
                    status: Só é possível aceitar ofertas de imóveis disponíveis (o imóvel está RESERVADO).

  /contratos:
    post:
      tags: [Contratos]
      summary: Admin cria o contrato de uma oferta aceita (gerando o PDF ou enviando um pronto)
      description: |
        A mesma rota tem **duas formas**, escolhidas pelo `Content-Type` da requisição:

        | `Content-Type` | Forma | Corpo | `origem` do contrato |
        |---|---|---|---|
        | `application/json` | **Gerar**: a API monta o PDF a partir de um modelo | `ContratoGerarInput` | `GERADO` |
        | `multipart/form-data` | **Upload**: o admin envia um PDF pronto (ex.: feito no Word) | `arquivo` + `ofertaId` | `UPLOAD` |

        Outro `Content-Type` → `415`. As duas formas têm as mesmas regras e a mesma resposta:
        - a oferta precisa existir (`400 { "ofertaId": "Oferta não encontrada." }`);
        - precisa estar `ACEITA` (`409`);
        - não pode ter outro contrato ativo, isto é, `AGUARDANDO_ASSINATURA` ou `ASSINADO` (`409`). Cancelar o contrato
          também cancela a oferta, então não dá para criar outro contrato para ela;
        - o contrato nasce `AGUARDANDO_ASSINATURA`, com `dataAprovacao` = agora.

        **PDF gerado.** O texto vem do template `templates/contrato/contrato.html` (A4, com rodapé
        "Oferta nº X - página N de M") e muda conforme o `tipo` da oferta:
        - `ALUGUEL` → "Contrato de Locação de Imóvel": valor mensal, dia de vencimento e prazo em meses;
        - `VENDA` → "Contrato de Compra e Venda de Imóvel": preço total, forma de pagamento, posse e escritura.

        Os dados vêm da própria oferta: nome e e-mail do cliente; título, tipo, endereço completo (rua, número,
        complemento, bairro, cidade/UF, CEP) e áreas do imóvel; `valorProposto`; data da oferta. A parte
        CONTRATADA é o valor de `app.contratos.empresa` (padrão `Corretora de Imóveis`). O corpo JSON só completa
        o texto (prazo, vencimento, forma de pagamento e cláusulas adicionais). Linhas vazias/campos ausentes do
        imóvel são omitidos. O arquivo salvo se chama `contrato-oferta-{ofertaId}.pdf`.
        Para ver o resultado antes de criar, use `POST /contratos/previa` com o mesmo corpo.

        O modelo é genérico: revise o texto do template com um advogado antes de usar em produção.
      operationId: createContrato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratoGerarInput'
            examples:
              aluguel:
                summary: Gerar contrato de aluguel
                value:
                  ofertaId: 7
                  prazoMeses: 12
                  diaVencimento: 5
                  formaPagamento: via boleto bancário
                  clausulasAdicionais: |-
                    1. É permitido animal de estimação.
                    2. A pintura ao fim da locação fica por conta do locatário.
              venda:
                summary: Gerar contrato de venda
                value:
                  ofertaId: 8
                  formaPagamento: à vista, na assinatura da escritura
              minimo:
                summary: Só a oferta (tudo com os valores padrão)
                value:
                  ofertaId: 7
          multipart/form-data:
            schema:
              type: object
              required: [arquivo, ofertaId]
              properties:
                arquivo:
                  type: string
                  format: binary
                  description: |
                    PDF não vazio: `Content-Type` da parte `application/pdf` **e** conteúdo começando com `%PDF-`.
                    Nome original com no máximo 150 caracteres (usado como nome do download). Limite de tamanho:
                    10MB (`spring.servlet.multipart.max-file-size`).
                    Mensagens em `arquivo`: `O arquivo é obrigatório e não pode estar vazio.`,
                    `O arquivo precisa ter um nome.`, `O nome do arquivo deve ter no máximo 150 caracteres.`,
                    `Formato inválido. Envie um arquivo PDF.`, `O arquivo excede o tamanho máximo de 10MB.`
                ofertaId:
                  type: integer
            encoding:
              arquivo:
                contentType: application/pdf
      responses:
        '201':
          description: Criado. Sem corpo; o id está no header `Location` (ex. `http://localhost:8080/contratos/3`).
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: |
            Erro de validação no formato `{ campo: mensagem }`:
            - comum: `{ "ofertaId": "Oferta não encontrada." }`;
            - gerar (JSON): regras de `ContratoGerarInput` (ex. `{ "ofertaId": "A oferta é obrigatória." }`,
              `{ "prazoMeses": "O prazo só se aplica a ofertas de aluguel." }`) e `{ "corpo": "JSON inválido ou ausente." }`;
            - upload (multipart): arquivo inválido (mensagens em `arquivo`) ou parâmetro ausente
              (`{ "ofertaId": "Campo obrigatório." }`, `{ "arquivo": "Campo obrigatório." }`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              examples:
                gerar:
                  value:
                    prazoMeses: O prazo só se aplica a ofertas de aluguel.
                upload:
                  value:
                    arquivo: Formato inválido. Envie um arquivo PDF.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            `{ "ofertaId": "Só é possível criar contrato para uma oferta aceita." }` ou
            `{ "ofertaId": "Esta oferta já tem um contrato aguardando assinatura ou assinado." }`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '415':
          description: '`Content-Type` diferente de `application/json` e `multipart/form-data` (corpo padrão do Spring)'
    get:
      tags: [Contratos]
      summary: Lista todos os contratos (admin)
      operationId: listContratos
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusContrato'
        - name: ofertaId
          description: Todos os contratos da oferta (inclusive cancelados)
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de contratos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContrato'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contratos/previa:
    post:
      tags: [Contratos]
      summary: Admin vê o PDF que seria gerado, sem salvar nada
      description: |
        Mesmo corpo (`ContratoGerarInput`) e mesmo PDF da forma "gerar" do `POST /contratos`, mas não cria
        contrato nem grava arquivo. Diferente do `POST /contratos`, aceita oferta em **qualquer status** (dá
        para conferir o texto antes de aceitar a oferta). O PDF não tem dados salvos: `dataEmissao` é a de agora.
        No frontend: `fetch` com o token, `res.blob()` e `URL.createObjectURL(blob)` num `<iframe>`.
      operationId: previewContrato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratoGerarInput'
      responses:
        '200':
          description: 'O PDF (`Content-Disposition: inline; filename="previa-contrato-oferta-{ofertaId}.pdf"`)'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: |
            Regras de `ContratoGerarInput`, `{ "ofertaId": "Oferta não encontrada." }` ou
            `{ "corpo": "JSON inválido ou ausente." }`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contratos/meus:
