  /contratos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Contratos]
      summary: Busca um contrato (cliente da oferta ou admin)
      operationId: getContrato
      responses:
        '200':
          description: Contrato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contrato'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Não existe ou é de outro usuário (corpo vazio)

  /contratos/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Contratos]
      summary: Baixa o PDF do contrato (cliente da oferta ou admin)
      description: Exige o token (não é uma URL pública). `Content-Disposition` inline com o nome original do arquivo.
      operationId: downloadContratoPdf
      responses:
        '200':
          description: O PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Não existe, é de outro usuário ou o arquivo sumiu do disco (corpo vazio)

  /contratos/{id}/assinar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Contratos]
      summary: Cliente assina o contrato
      description: |
        Só o cliente dono da oferta (para qualquer outro usuário, inclusive o admin, responde `404`).
        Na mesma transação:
        - contrato → `ASSINADO`, com `dataAssinatura` = agora (a oferta continua `ACEITA`);
        - imóvel → `ALUGADO` (oferta `ALUGUEL`) ou `VENDIDO` (oferta `VENDA`);
        - todas as outras ofertas em aberto (`PENDENTE`/`EM_ESPERA`) do imóvel → `RECUSADA`.
      operationId: signContrato
      responses:
        '200':
          description: Contrato assinado (`status = ASSINADO`, `dataAssinatura` preenchida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contrato'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Não existe ou não é do usuário (corpo vazio)
        '409':
          description: Contrato não está aguardando assinatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              example:
                status: Só contratos aguardando assinatura podem ser assinados.

  /contratos/{id}/cancelar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Contratos]
      summary: Admin cancela um contrato ainda não assinado (desistência do cliente)
      description: |
        Só contrato `AGUARDANDO_ASSINATURA`. Na mesma transação:
        - contrato → `CANCELADO`;
        - a oferta dele → `CANCELADA` (não recebe outro contrato; para recomeçar, é preciso uma nova oferta aceita);
        - imóvel → `DISPONIVEL` (só se ainda estiver `RESERVADO`; um status trocado manualmente pelo admin é mantido);
        - as outras ofertas `EM_ESPERA` do imóvel → `PENDENTE`, e o admin pode aceitar uma delas.
      operationId: cancelContrato
      responses:
        '200':
          description: Contrato cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contrato'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Contrato não encontrado (corpo vazio)
        '409':
          description: Contrato já assinado ou cancelado (inclusive se a assinatura aconteceu ao mesmo tempo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              example:
                status: Só contratos aguardando assinatura podem ser cancelados.

  /favoritos:
    get:
      tags: [Favoritos]
      summary: Lista os imóveis favoritos do usuário logado
      operationId: listFavoritos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de imóveis (com `fotos`). O `sort` usa os campos do imóvel (ex. `sort=titulo,asc`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageImovel'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /favoritos/{imovelId}:
    parameters:
      - name: imovelId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Favoritos]
      summary: Diz se o imóvel é favorito do usuário logado
      operationId: isFavorito
      responses:
        '200':
          description: '`favorito` é `false` também para imóvel inexistente'
          content:
            application/json:
              schema:
                type: object
                required: [favorito]
                properties:
                  favorito:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Favoritos]
      summary: Favorita o imóvel (idempotente)
      operationId: addFavorito
      responses:
        '204':
          description: Favoritado (ou já era)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Imóvel não encontrado (corpo vazio)
    delete:
      tags: [Favoritos]
      summary: Desfavorita o imóvel (idempotente)
      operationId: removeFavorito
      responses:
        '204':
          description: Removido (ou não era favorito)
        '401':
          $ref: '#/components/responses/Unauthorized'

  /email:
    get:
      tags: [E-mail]
      summary: Envia um e-mail de teste (endpoint de desenvolvimento)
      operationId: sendTestEmail
      responses:
        '200':
          description: Enviado
          content:
            text/plain:
              schema:
                type: string
                example: Enviado
        '400':
          description: Falha no envio (mensagem do erro)
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      description: Número da página (começa em 0)
      schema:
        type: integer
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      description: Itens por página (valores acima de 100 são limitados a 100)
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    Sort:
      name: sort
      in: query
      description: |
        Ordenação no formato `campo,asc|desc` (padrão `id,asc`). Pode repetir o parâmetro.
        Campo inexistente → `500`.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          example: nome,asc

  responses:
    Created:
      description: Criado. Sem corpo; o id do novo recurso está no header `Location`.
      headers:
        Location:
          description: URL do recurso criado
          schema:
            type: string
            format: uri
            example: http://localhost:8080/imoveis/12
    ValidationError:
      description: |
        Erro de validação: objeto `{ campo: mensagem }` com a primeira mensagem de cada campo inválido.
        As regras e mensagens de cada campo estão no schema do corpo da requisição.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrors'
          example:
            titulo: O título é obrigatório.
            cep: CEP inválido. Use o formato 00000-000.
    Unauthorized:
      description: Token ausente, inválido ou expirado (corpo vazio)
    Forbidden:
      description: Usuário autenticado sem a role ADMIN (corpo vazio)
    EmailConflict:
      description: E-mail já cadastrado
      content:
        text/plain:
          schema:
            type: string
            example: E-mail já cadastrado.
    ServerError:
      description: 'Erro interno (ex.: id inexistente)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Role:
      type: string
      enum: [ADMIN, BASIC]

    ValidationErrors:
      type: object
      description: Mapa campo → mensagem (uma por campo). Campos aninhados usam ponto, ex. `tipoImovel.id`.
      additionalProperties:
        type: string

    LoginRequest:
      type: object
      required: [email, senha]
      description: |
        Só valida presença (`O e-mail é obrigatório.`, `A senha é obrigatória.`); credenciais erradas → `401`.
      properties:
        email:
          type: string
        senha:
          type: string
          format: password

    CadastroRequest:
      type: object
      required: [nome, email, senha]
      properties:
        nome:
          type: string
          maxLength: 255
          description: |
            Espaços nas pontas são removidos. Mensagens: `O nome é obrigatório.`, `O nome deve ter no máximo 255 caracteres.`
        email:
          type: string
          format: email
          maxLength: 255
          description: |
            Mensagens: `O e-mail é obrigatório.`, `E-mail inválido.`, `O e-mail deve ter no máximo 255 caracteres.`
        senha:
          type: string
          format: password
          minLength: 6
          maxLength: 72
          description: 'Mensagens: `A senha é obrigatória.`, `A senha deve ter entre 6 e 72 caracteres.`'

    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: 'JWT a ser enviado em `Authorization: Bearer <token>`'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Administrador
        email:
          type: string
          format: email
          example: admin@admin.com
        role:
          $ref: '#/components/schemas/Role'

    UserCreateInput:
      type: object
      required: [nome, email, senha]
      properties:
        nome:
          type: string
          maxLength: 255
          description: 'Mensagens: `O nome é obrigatório.`, `O nome deve ter no máximo 255 caracteres.`'
        email:
          type: string
          format: email
          maxLength: 255
          description: 'Mensagens: `O e-mail é obrigatório.`, `E-mail inválido.`, `O e-mail deve ter no máximo 255 caracteres.`'
        senha:
          type: string
          format: password
          minLength: 6
          maxLength: 72
          description: 'Mensagens: `A senha é obrigatória.`, `A senha deve ter entre 6 e 72 caracteres.`'
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          description: 'Opcional (padrão `BASIC`). Valor fora do enum → `{ "role": "Formato inválido." }`.'

    UserUpdateInput:
      type: object
      required: [nome, email]
      properties:
        nome:
          type: string
          maxLength: 255
          description: 'Mensagens: `O nome é obrigatório.`, `O nome deve ter no máximo 255 caracteres.`'
        email:
          type: string
          format: email
          maxLength: 255
          description: 'Mensagens: `O e-mail é obrigatório.`, `E-mail inválido.`, `O e-mail deve ter no máximo 255 caracteres.`'
        senha:
          type: string
          format: password
          maxLength: 72
          description: |
            Opcional. Vazio, só espaços ou ausente mantém a senha atual; se enviada, precisa ter de 6 a 72 caracteres
            (`A senha deve ter entre 6 e 72 caracteres.`).
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          description: Opcional; ausente mantém a role atual. Valor fora do enum → `Formato inválido.`

    Bairro:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Centro
        cidade:
          type: string
          example: Curitiba
        estado:
          type: string
          example: PR
        cepInicial:
          type: string
          example: 80010-000
        cepFinal:
          type: string
          example: 80060-999

    BairroInput:
      type: object
      required: [nome, cidade, estado]
      properties:
        nome:
          type: string
          maxLength: 255
          description: 'Mensagens: `O nome é obrigatório.`, `O nome deve ter no máximo 255 caracteres.`'
        cidade:
          type: string
          maxLength: 255
          description: 'Mensagens: `A cidade é obrigatória.`, `A cidade deve ter no máximo 255 caracteres.`'
        estado:
          type: string
          enum: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
          description: |
            Sigla da UF em maiúsculas. Mensagens: `O estado é obrigatório.`,
            `Estado inválido. Use a sigla da UF em maiúsculas (ex.: RS).`
        cepInicial:
          type: string
          nullable: true
          pattern: '^\d{5}-\d{3}$'
          example: 98280-000
          description: 'Opcional. Mensagem: `CEP inicial inválido. Use o formato 00000-000.`'
        cepFinal:
          type: string
          nullable: true
          pattern: '^\d{5}-\d{3}$'
          example: 98289-999
          description: 'Opcional. Mensagem: `CEP final inválido. Use o formato 00000-000.`'

    TipoImovel:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Apartamento
        descricao:
          type: string
        createdAt:
          $ref: '#/components/schemas/LocalDateTime'
        updatedAt:
          $ref: '#/components/schemas/LocalDateTime'

    TipoImovelInput:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          maxLength: 255
          description: 'Mensagens: `O nome é obrigatório.`, `O nome deve ter no máximo 255 caracteres.`'
        descricao:
          type: string
          nullable: true
          maxLength: 255
          description: 'Mensagem: `A descrição deve ter no máximo 255 caracteres.`'

    Imovel:
      type: object
      properties:
        id:
          type: integer
          example: 12
        titulo:
          type: string
          example: Apartamento 2 quartos no Centro
        descricao:
          type: string
        precoVenda:
          type: number
          nullable: true
          example: 450000.00
        precoAluguel:
          type: number
          nullable: true
          example: 2200.00
        finalidade:
          type: string
          description: Texto livre (ex. venda, aluguel, venda/aluguel)
        status:
          $ref: '#/components/schemas/StatusImovel'
        dormitorios:
          type: integer
        banheiros:
          type: integer
        garagem:
          type: integer
        areaTotal:
          type: number
        areaConstruida:
          type: number
        endereco:
          type: string
        numero:
          type: string
        complemento:
          type: string
        cep:
          type: string
          maxLength: 9
          example: 80010-000
        caracteristicas:
          type: string
          description: Texto livre
        destaque:
          type: boolean
          default: false
        tipoImovel:
          allOf:
            - $ref: '#/components/schemas/TipoImovel'
          nullable: true
        bairro:
          allOf:
            - $ref: '#/components/schemas/Bairro'
          nullable: true
        fotos:
          type: array
          readOnly: true
          description: |
            URLs absolutas das fotos do imóvel: a capa primeiro, depois pela `ordem` e por fim pela ordem de envio.
            Array vazio quando o imóvel não tem fotos. Vem só em `GET /imoveis` (em cada item de `content`) e `GET /imoveis/{id}`
            (não aparece no `imovel` aninhado da resposta de `/fotos`). Se for enviado em POST/PUT, é ignorado.
          items:
            type: string
            format: uri
          example:
            - http://localhost:8080/uploads/12/3f2a9c1e-7b1d-4c55-9a0e-2d4b8f6e1a77_fachada.jpg
            - http://localhost:8080/uploads/12/8c0d5e2b-1f3a-4b6c-8d9e-0a1b2c3d4e5f_sala%20de%20estar.jpg
        createdAt:
          $ref: '#/components/schemas/LocalDateTime'
        updatedAt:
          $ref: '#/components/schemas/LocalDateTime'

    ImovelInput:
      type: object
      required: [titulo]
      description: |
        Campos omitidos são gravados como `null` (no PUT também), exceto `destaque`, que vira `false`.
      properties:
        titulo:
          type: string
          maxLength: 255
          description: 'Mensagens: `O título é obrigatório.`, `O título deve ter no máximo 255 caracteres.`'
        descricao:
          type: string
          nullable: true
          maxLength: 16000
          description: 'Mensagem: `A descrição deve ter no máximo 16000 caracteres.`'
        precoVenda:
          type: number
          nullable: true
          minimum: 0
          description: |
            Até 13 dígitos inteiros e 2 casas decimais. Mensagens: `O preço de venda não pode ser negativo.`,
            `O preço de venda deve ter até 13 dígitos inteiros e 2 casas decimais.`
        precoAluguel:
          type: number
          nullable: true
          minimum: 0
          description: |
            Até 13 dígitos inteiros e 2 casas decimais. Mensagens: `O preço de aluguel não pode ser negativo.`,
            `O preço de aluguel deve ter até 13 dígitos inteiros e 2 casas decimais.`
        finalidade:
          type: string
          nullable: true
          maxLength: 255
          description: 'Mensagem: `A finalidade deve ter no máximo 255 caracteres.`'
        status:
          allOf:
            - $ref: '#/components/schemas/StatusImovel'
          nullable: true
          default: DISPONIVEL
          description: |
            Opcional; omitido ou `null` vira `DISPONIVEL`. Fora do enum (inclusive o texto livre antigo, como
            `"Disponível"`) → `{ "status": "Formato inválido." }`. O admin pode definir qualquer valor; o fluxo de
            ofertas/contratos também muda este campo automaticamente.
        dormitorios:
          type: integer
          nullable: true
          minimum: 0
          description: 'Mensagem: `O número de dormitórios não pode ser negativo.`'
        banheiros:
          type: integer
          nullable: true
          minimum: 0
          description: 'Mensagem: `O número de banheiros não pode ser negativo.`'
        garagem:
          type: integer
          nullable: true
          minimum: 0
          description: 'Mensagem: `O número de vagas de garagem não pode ser negativo.`'
        areaTotal:
          type: number
          nullable: true
          minimum: 0
          description: |
            Até 8 dígitos inteiros e 2 casas decimais. Mensagens: `A área total não pode ser negativa.`,
            `A área total deve ter até 8 dígitos inteiros e 2 casas decimais.`
        areaConstruida:
          type: number
          nullable: true
          minimum: 0
          description: |
            Até 8 dígitos inteiros e 2 casas decimais. Mensagens: `A área construída não pode ser negativa.`,
            `A área construída deve ter até 8 dígitos inteiros e 2 casas decimais.`
        endereco:
          type: string
          nullable: true
          maxLength: 255
          description: 'Mensagem: `O endereço deve ter no máximo 255 caracteres.`'
        numero:
          type: string
          nullable: true
          maxLength: 255
          description: 'Mensagem: `O número deve ter no máximo 255 caracteres.`'
        complemento:
          type: string
          nullable: true
          maxLength: 255
          description: 'Mensagem: `O complemento deve ter no máximo 255 caracteres.`'
        cep:
          type: string
          nullable: true
          pattern: '^\d{5}-\d{3}$'
          example: 98280-000
          description: 'Opcional, com hífen. Mensagem: `CEP inválido. Use o formato 00000-000.`'
        caracteristicas:
          type: string
          nullable: true
          maxLength: 16000
          description: 'Mensagem: `As características devem ter no máximo 16000 caracteres.`'
        destaque:
          type: boolean
          default: false
          description: Omitido ou `null` grava `false`.
        tipoImovel:
          allOf:
            - $ref: '#/components/schemas/IdRef'
          nullable: true
          description: |
            Opcional. Se enviado, o id precisa existir: `{ "tipoImovel.id": "Tipo de imóvel não encontrado." }`.
        bairro:
          allOf:
            - $ref: '#/components/schemas/IdRef'
          nullable: true
          description: 'Opcional. Se enviado, o id precisa existir: `{ "bairro.id": "Bairro não encontrado." }`.'
      example:
        titulo: Apartamento 2 quartos no Centro
        descricao: Próximo ao metrô, reformado.
        precoVenda: 450000
        precoAluguel: null
        finalidade: venda
        status: disponivel
        dormitorios: 2
        banheiros: 1
        garagem: 1
        areaTotal: 68.5
        areaConstruida: 60
        endereco: Rua XV de Novembro
        numero: '1000'
        complemento: Apto 52
        cep: 80010-000
        caracteristicas: Sacada, churrasqueira
        destaque: true
        tipoImovel: { id: 1 }
        bairro: { id: 1 }

    ImovelSaberMais:
      type: object
      required: [nome, email, mensagem]
      properties:
        nome:
          type: string
          maxLength: 255
          description: 'Mensagens: `O nome é obrigatório.`, `O nome deve ter no máximo 255 caracteres.`'
        email:
          type: string
          format: email
          maxLength: 255
          description: 'Mensagens: `O e-mail é obrigatório.`, `E-mail inválido.`, `O e-mail deve ter no máximo 255 caracteres.`'
        telefone:
          type: string
          nullable: true
          pattern: '^[0-9()+\- ]{8,20}$'
          example: (55) 99999-1234
          description: |
            Opcional. De 8 a 20 caracteres entre dígitos, espaços, parênteses, `+` e `-`. Mensagem:
            `Telefone inválido. Use de 8 a 20 caracteres entre dígitos, espaços, parênteses, + e -.`
        mensagem:
          type: string
          maxLength: 2000
          description: 'Mensagens: `A mensagem é obrigatória.`, `A mensagem deve ter no máximo 2000 caracteres.`'

    FotoImovel:
      type: object
      properties:
        id:
          type: integer
        nomeArquivo:
          type: string
          description: '`<uuid>_<nome original>`'
        caminho:
          type: string
          description: |
            Caminho no disco do servidor (ex. `./uploads/12/<uuid>_foto.jpg`); não é uma URL.
            A URL pública é `/uploads/{imovel.id}/{nomeArquivo}`.
        capa:
          type: boolean
          nullable: true
          description: '`null` até alguma foto do imóvel ser definida como capa.'
        ordem:
          type: integer
          nullable: true
          description: Ainda não é preenchido pela API.
        imovel:
          $ref: '#/components/schemas/Imovel'
        createdAt:
          $ref: '#/components/schemas/LocalDateTime'
        updatedAt:
          $ref: '#/components/schemas/LocalDateTime'

    IdRef:
      type: object
      required: [id]
      properties:
        id:
          type: integer

    LocalDateTime:
      type: string
      description: Data/hora sem fuso horário (ISO-8601)
      example: '2026-10-27T14:03:21.123456'

    PageMetadata:
      type: object
      description: |
        Metadados da página. Primeira página: `number == 0`.
        Última página: `number >= totalPages - 1` (com `totalPages == 0` quando não há resultados).
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          description: Tamanho da página solicitado (após o limite de 100)
          example: 20
        number:
          type: integer
          description: Página atual (começa em 0)
          example: 0
        totalElements:
          type: integer
          description: Total de registros em todas as páginas
          example: 57
        totalPages:
          type: integer
          example: 3

    PageImovel:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Imovel'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PageBairro:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Bairro'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PageTipoImovel:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TipoImovel'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PageUser:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMetadata'

    StatusImovel:
      type: string
      enum: [DISPONIVEL, RESERVADO, ALUGADO, VENDIDO]
      description: |
        Só `DISPONIVEL` recebe ofertas. Mudanças automáticas: oferta aceita → `RESERVADO`; contrato assinado →
        `ALUGADO`/`VENDIDO`; contrato cancelado → `DISPONIVEL`. Valores antigos de texto livre foram convertidos para
        `DISPONIVEL` na inicialização da API.

    TipoOferta:
      type: string
      enum: [ALUGUEL, VENDA]

    StatusOferta:
      type: string
      enum: [PENDENTE, ACEITA, EM_ESPERA, RECUSADA, CANCELADA]
      description: '`PENDENTE`/`EM_ESPERA` = em aberto; `ACEITA`, `RECUSADA`, `CANCELADA` = finais.'

    StatusContrato:
      type: string
      enum: [AGUARDANDO_ASSINATURA, ASSINADO, CANCELADO]

    OrigemContrato:
      type: string
      enum: [GERADO, UPLOAD]
      description: '`GERADO` = PDF montado pela API (`POST /contratos` com JSON); `UPLOAD` = PDF enviado pelo admin (multipart).'

    ContratoGerarInput:
      type: object
      required: [ofertaId]
      description: |
        Corpo para gerar o PDF (`POST /contratos` com JSON e `POST /contratos/previa`). Cliente, imóvel, tipo e
        valor vêm da oferta; os demais campos são opcionais e só completam o texto.
      properties:
        ofertaId:
          type: integer
          description: 'Mensagens: `A oferta é obrigatória.`, `Oferta não encontrada.`'
        prazoMeses:
          type: integer
          nullable: true
          minimum: 1
          maximum: 360
          default: 30
          description: |
            Só para oferta de **ALUGUEL**: prazo da locação em meses (padrão 30). Mensagens:
            `O prazo deve ser de 1 a 360 meses.`; em oferta de venda: `O prazo só se aplica a ofertas de aluguel.`
        diaVencimento:
          type: integer
          nullable: true
          minimum: 1
          maximum: 28
          default: 10
          description: |
            Só para oferta de **ALUGUEL**: dia do mês do vencimento (padrão 10; até 28 para existir em todos os meses).
            Mensagens: `O dia de vencimento deve ser de 1 a 28.`; em oferta de venda:
            `O dia de vencimento só se aplica a ofertas de aluguel.`
        formaPagamento:
          type: string
          nullable: true
          maxLength: 500
          default: conforme acordado entre as partes
          description: |
            Completa a frase "... a ser pago <formaPagamento>." (ex. `via boleto bancário`,
            `à vista, na assinatura da escritura`). Vazio usa o padrão.
            Mensagem: `A forma de pagamento deve ter no máximo 500 caracteres.`
        clausulasAdicionais:
          type: string
          nullable: true
          maxLength: 4000
          description: |
            Texto livre que vira a seção "5. Das cláusulas adicionais" (omitida se vazio). Quebras de linha são
            preservadas; HTML é exibido como texto (não é interpretado).
            Mensagem: `As cláusulas adicionais devem ter no máximo 4000 caracteres.`

    ImovelResumo:
      type: object
      properties:
        id:
          type: integer
        titulo:
          type: string
        precoVenda:
          type: number
          nullable: true
        precoAluguel:
          type: number
          nullable: true
        status:
          $ref: '#/components/schemas/StatusImovel'

    Oferta:
      type: object
      properties:
        id:
          type: integer
          example: 7
        imovel:
          $ref: '#/components/schemas/ImovelResumo'
        usuario:
          $ref: '#/components/schemas/User'
        tipo:
          $ref: '#/components/schemas/TipoOferta'
        valorProposto:
          type: number
          example: 350000.5
        mensagem:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/StatusOferta'
        createdAt:
          $ref: '#/components/schemas/LocalDateTime'
        updatedAt:
          $ref: '#/components/schemas/LocalDateTime'

    OfertaInput:
      type: object
      required: [imovelId, tipo, valorProposto]
      properties:
        imovelId:
          type: integer
          description: 'Mensagens: `O imóvel é obrigatório.`, `Imóvel não encontrado.`'
        tipo:
          allOf:
            - $ref: '#/components/schemas/TipoOferta'
          description: 'Mensagens: `O tipo da oferta é obrigatório.`; fora do enum → `Formato inválido.`'
        valorProposto:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 9999999999999.99
          description: |
            Até 13 dígitos inteiros e 2 casas decimais. Mensagens: `O valor proposto é obrigatório.`,
            `O valor proposto deve ser maior que zero.`,
            `O valor proposto deve ter até 13 dígitos inteiros e 2 casas decimais.`
        mensagem:
          type: string
          nullable: true
          maxLength: 2000
          description: |
            Opcional; espaços nas pontas são removidos e vazio vira `null`.
            Mensagem: `A mensagem deve ter no máximo 2000 caracteres.`
      example:
        imovelId: 12
        tipo: VENDA
        valorProposto: 350000.5
        mensagem: Pago à vista.

    OfertaStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACEITA, EM_ESPERA, RECUSADA]
          description: |
            Mensagens: `O status é obrigatório.`, `Status inválido. Use ACEITA, EM_ESPERA ou RECUSADA.`
            (para `PENDENTE`/`CANCELADA`); fora do enum `StatusOferta` → `Formato inválido.`

    Contrato:
      type: object
      properties:
        id:
          type: integer
          example: 3
        oferta:
          $ref: '#/components/schemas/Oferta'
        status:
          $ref: '#/components/schemas/StatusContrato'
        origem:
          $ref: '#/components/schemas/OrigemContrato'
        nomeArquivo:
          type: string
          description: 'Nome do download: o original no upload; `contrato-oferta-{ofertaId}.pdf` no gerado'
          example: contrato-oferta-7.pdf
        urlPdf:
          type: string
          format: uri
          description: '`GET /contratos/{id}/pdf` (exige token)'
          example: http://localhost:8080/contratos/3/pdf
        dataAprovacao:
          $ref: '#/components/schemas/LocalDateTime'
        dataAssinatura:
          allOf:
            - $ref: '#/components/schemas/LocalDateTime'
          nullable: true
          description: '`null` até o cliente assinar'
        createdAt:
          $ref: '#/components/schemas/LocalDateTime'
        updatedAt:
          $ref: '#/components/schemas/LocalDateTime'

    PageOferta:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Oferta'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PageContrato:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Contrato'
        page:
          $ref: '#/components/schemas/PageMetadata'

    ErrorResponse:
      type: object
      description: Corpo de erro padrão do Spring Boot
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 500
        error:
          type: string
          example: Internal Server Error
        path:
          type: string
          example: /fotos/99
