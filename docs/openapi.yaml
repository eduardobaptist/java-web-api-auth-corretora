      tags: [Ofertas]
      summary: Cliente cancela a própria oferta
      description: Só o dono (nem o admin cancela oferta alheia; ele usa `RECUSADA`) e só se `PENDENTE`/`EM_ESPERA`.
      operationId: cancelOferta
      responses:
