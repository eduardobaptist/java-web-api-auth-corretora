  /ofertas:
    post:
      tags: [Ofertas]
      summary: Cliente faz uma oferta por um imóvel
      description: |
        A oferta nasce `PENDENTE`, ligada ao usuário do token. Regras:
        - o imóvel precisa estar `DISPONIVEL` (reservado, alugado ou vendido → `409`);
        - o cliente não pode ter outra oferta em aberto (`PENDENTE`/`EM_ESPERA`) para o mesmo imóvel; depois de
          cancelada, recusada ou aceita, pode ofertar de novo (se o imóvel estiver disponível);
        - vários clientes podem ofertar no mesmo imóvel.
      operationId: createOferta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaInput'
      responses:
        '201':
          description: Criada. Sem corpo; o id está no header `Location` (ex. `http://localhost:8080/ofertas/7`).
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: |
            Erro de validação (ver `OfertaInput`) ou imóvel inexistente: `{ "imovelId": "Imóvel não encontrado." }`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            `{ "imovelId": "Este imóvel não está disponível para ofertas." }` (status do imóvel diferente de
            `DISPONIVEL`) ou `{ "imovelId": "Você já tem uma oferta em aberto para este imóvel." }`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              examples:
                indisponivel:
                  value:
                    imovelId: Este imóvel não está disponível para ofertas.
                duplicada:
                  value:
                    imovelId: Você já tem uma oferta em aberto para este imóvel.
    get:
      tags: [Ofertas]
      summary: Lista todas as ofertas (admin)
      operationId: listOfertas
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusOferta'
        - name: imovelId
          in: query
          schema:
            type: integer
        - name: usuarioId
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de ofertas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOferta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

